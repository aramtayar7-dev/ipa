<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guevara App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        .app-card {
            transition: all 0.3s ease;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .badge {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-purple-900 to-black text-white">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-lg border-b border-purple-500/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-purple-600 rounded-lg flex items-center justify-center">
                        <span class="text-lg font-bold">G</span>
                    </div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Guevara App Store</h1>
                </div>
                <div id="app-count" class="text-purple-400 font-semibold">جێبەجێی گەڕاندن...</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Hero Section -->
        <section class="text-center mb-16">
            <h2 class="text-5xl font-bold mb-4 bg-gradient-to-r from-blue-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">بەرنامەی سەرنج راکێش</h2>
            <p class="text-xl text-gray-300 max-w-2xl mx-auto">ستۆری سەرکردار بۆ داونلۆدکردنی بەرنامەکانی بەهێز و دەستکاریکراو</p>
        </section>

        <!-- Apps Grid -->
        <section id="apps-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Apps will be loaded here -->
            <div class="col-span-full text-center py-12">
                <div class="inline-block">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500"></div>
                </div>
                <p class="text-gray-400 mt-4">بارکردنی بەرنامەکان...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-purple-500/20 mt-20 py-12 text-center text-gray-400">
        <p>© 2026 Guevara App Store. تەمام مافان پارێزراوە.</p>
    </footer>

    <script>
        async function loadApps() {
            try {
                const response = await fetch('apps.json');
                const data = await response.json();
                
                const container = document.getElementById('apps-container');
                container.innerHTML = ''; // Clear loading state

                if (!data.apps || data.apps.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-gray-400">بەرنامەیەک دۆزی نەهات</p>';
                    return;
                }

                // Update app count
                document.getElementById('app-count').textContent = `${data.apps.length} بەرنامە دەستدا`;

                // Create app cards
                data.apps.forEach((app, index) => {
                    const card = document.createElement('div');
                    card.className = 'app-card bg-gradient-to-br from-purple-900/50 to-blue-900/50 backdrop-blur rounded-2xl overflow-hidden border border-purple-500/30 hover:border-purple-500/70';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    const size = (app.size / 1000000).toFixed(1);
                    
                    card.innerHTML = `
                        <div class="relative h-40 bg-gradient-to-b from-purple-600 to-blue-600 overflow-hidden">
                            <img src="${app.iconURL}" alt="${app.name}" class="w-full h-full object-cover" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23444%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23888%22 font-size=%2240%22%3E📱%3C/text%3E%3C/svg%3E'">
                        </div>
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-white mb-2 line-clamp-2">${app.name}</h3>
                            <p class="text-sm text-gray-300 mb-3 line-clamp-2">${app.localizedDescription}</p>
                            
                            <div class="space-y-2 mb-4 text-xs text-gray-400">
                                <div class="flex justify-between">
                                    <span>وەشان:</span>
                                    <span class="font-semibold text-purple-300">${app.version}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>قەبارە:</span>
                                    <span class="font-semibold text-blue-300">${size} MB</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>بەرھەمھێنەر:</span>
                                    <span class="font-semibold text-green-300">${app.developerName}</span>
                                </div>
                            </div>
                            
                            <a href="${app.downloadURL}" target="_blank" class="block w-full bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white font-bold py-2 px-4 rounded-lg text-center transition-all transform hover:scale-105">
                                ⬇️ داونلۆد
                            </a>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('خرۆپە لە بارکردنی بەرنامەکان:', error);
                document.getElementById('apps-container').innerHTML = `
                    <div class="col-span-full text-center text-red-400 py-12">
                        <p>❌ خرۆپە لە بارکردنی بەرنامەکان</p>
                        <p class="text-sm text-gray-400 mt-2">${error.message}</p>
                    </div>
                `;
            }
        }

        // Load apps when page is ready
        document.addEventListener('DOMContentLoaded', loadApps);
    </script>
</body>
</html>
